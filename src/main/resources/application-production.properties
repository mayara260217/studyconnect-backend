# =============================================================================
# application-production.properties — PRODUCAO (Render Free)
#
# Ativado pelo Render via Environment Variable:
#   SPRING_PROFILES_ACTIVE = production
#
# As credenciais do banco NAO ficam aqui.
# ============================================================================

# =============================================================================
# STARTUP OTIMIZACAO #1 — Lazy Initialization
#
# Por padrao, o Spring cria TODOS os beans no startup, mesmo os que nunca
# serao usados naquela execucao. Com lazy=true, cada bean so e criado quando
# e requisitado pela primeira vez.
#
# Impacto esperado: -8s a -15s no startup
# Risco: o primeiro request que tocar um bean nao inicializado vai ser mais
# lento. Para um TCC isso e aceitavel — o cold start ja e lento de qualquer
# forma, e os requests subsequentes sao normais.
# =============================================================================
spring.main.lazy-initialization=true

# =============================================================================
# STARTUP OTIMIZACAO #2 — Desabilitar auto-configuracoes nao utilizadas
#
# O Spring Boot tenta auto-configurar dezenas de features que esse projeto
# nao usa: cache, JMX, admin endpoints, task scheduling, etc.
# Cada auto-configuracao e uma classe carregada + beans criados no startup.
#
# Lista do que desabilitar e por que:
#   JmxAutoConfiguration         — JMX e para monitoramento via MBeans, nao usado
#   TaskExecutionAutoConfiguration — thread pool para @Async, nao usado
#   TaskSchedulingAutoConfiguration — @Scheduled, nao usado
#   AopAutoConfiguration          — AOP/proxies, nao usado diretamente
#   AdminServerAutoConfiguration  — Spring Boot Admin, nao usado
# =============================================================================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskExecutionAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskSchedulingAutoConfiguration

# =============================================================================
# STARTUP OTIMIZACAO #3 — Hibernate sem validacao de schema
# =============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Desativa a geracao de estatisticas do Hibernate (overhead de startup e runtime)
spring.jpa.properties.hibernate.generate_statistics=false

# Desativa o segundo nivel de cache do Hibernate (nao configurado, mas tenta
# inicializar de qualquer forma sem essa flag)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# =============================================================================
# STARTUP OTIMIZACAO #4 — HikariCP producao
# Pool de 2 conexoes: suficiente para Render Free, economiza RAM e tempo
# de handshake TLS com o Somee no startup.
# =============================================================================
spring.datasource.hikari.maximum-pool-size=2

# =============================================================================
# Logs silenciosos em producao
# Logs excessivos consomem I/O do container e atrasam o startup.
# =============================================================================
logging.level.root=WARN
logging.level.com.itb.inf3em.studyconnect=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG

# =============================================================================
# Erros em producao — nao expoe detalhes internos
# =============================================================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
